# Numbers reported in Lee et al., "Low-Complexity Semantic Packet Aggregation
# for Token Communication via Lookahead Search", IEEE TCOM vol. 74, 2026,
# and where our runs produce the matching quantity.
#
# source: text   = stated in the paper's text or a table (exact)
#         plot   = read off a figure by eye (about +-0.003 for ATS axes,
#                  +-0.02 for the WTS axis)
#
# ours: how to compute the matching number from results/stage4/<experiment>/summary.csv
#   value:  {experiment, algorithm, metric, where: {column: value}}
#   gain:   relative gain of `a` over `b` in percent, (a / b - 1) * 100
#
# metric is a summary column without the "mean_" prefix: ats, wts_L1..., logical_calls.

entries:

  # ---------------- Fig. 6a: ATS vs SNR (MS-COCO, K=8, M=4) ----------------
  - id: fig6a_gain_random
    figure: Fig. 6a
    quantity: SemPA-Look ATS gain over Random PA at 6 dB
    setting: COCO, K=8, M=4, P=10, k=4
    paper: 14.32
    unit: "%"
    source: text
    ours:
      gain:
        a: {experiment: coco_k8, algorithm: sempa_look, metric: ats, where: {snr_db: 6}}
        b: {experiment: coco_k8, algorithm: random_pa, metric: ats, where: {snr_db: 6}}

  - id: fig6a_gain_nopack
