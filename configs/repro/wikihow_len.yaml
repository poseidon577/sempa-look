# Fig. 12: ATS and WTS (L=1) vs sentence length K with M=5, 7 dB.
# K=50, 60 need 2^10 and 2^12 encodes per partition: see wikihow_len_long.
experiment: wikihow_len
description: Sentence length sweep, M=5 (Fig. 12, K=10..40)
encoder: mpnet
data:
  source: wikihow
  path: data/wikihow/wikihowAll.csv
  max_articles: 20000
M: 5
k: 4
P: 10
snr_db: [7]
sweep:
  param: K
  values: [10, 20, 30, 40]
algorithms: [sempa_look, random_pa]
