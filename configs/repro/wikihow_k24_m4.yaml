# K=24, M=4 (N=6, k_max=5) on WikiHow sentences, sweeping the lookahead width k.
#   Fig. 10a   ATS vs k at 7 dB
#   Fig. 16    cosine-similarity ATS vs k (BLEURT/BERTScore panels not reproduced)
#   Table II   SemPA-Look vs Random PA at 6 dB (k=4; MCTS baseline not implemented)
experiment: wikihow_k24_m4
description: K=24, M=4 lookahead sweep (Fig. 10a, Fig. 16, Table II)
encoder: mpnet
data:
  source: wikihow
  path: data/wikihow/wikihowAll.csv
  max_articles: 20000
K: 24
M: 4
P: 10
snr_db: [6, 7]
sweep:
  param: k
  values: [0, 1, 2, 3, 4, 5]
algorithms: [sempa_look, random_pa]
