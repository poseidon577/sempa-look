# Subword-tokenization counterpart of wikihow_fixed_n4.yaml: same settings, but
# messages have exactly K MPNet WordPiece tokens (see
# src/sempalab/tokenization.py and docs/assumptions.md, A11-A12).
# Fig. 13: ATS vs K with the number of subpackets fixed at N=4 (M = K/4), 7 dB.
experiment: wikihow_fixed_n4_subword
description: Fixed N=4, growing K (Fig. 13), subword tokens
encoder: mpnet
tokenization: subword
data:
  source: wikihow
  path: data/wikihow/wikihowAll.csv
  max_articles: 20000
fixed_N: 4
k: 4
P: 10
snr_db: [7]
sweep:
  param: K
  values: [8, 12, 16, 20, 24, 28]
algorithms: [sempa_look, random_pa]
