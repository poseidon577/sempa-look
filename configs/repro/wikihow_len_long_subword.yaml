# Subword-tokenization counterpart of wikihow_len_long.yaml: same settings, but
# messages have exactly K MPNet WordPiece tokens (see
# src/sempalab/tokenization.py and docs/assumptions.md, A11-A12).
# Fig. 12 continued: K=50, 60 (N=10, 12) with 20 messages.
experiment: wikihow_len_long_subword
description: Sentence length sweep, M=5 (Fig. 12, K=50, 60), subword tokens
encoder: mpnet
tokenization: subword
data:
  source: wikihow
  path: data/wikihow/wikihowAll.csv
  max_articles: 20000
  num_messages: 20
M: 5
k: 4
P: 10
snr_db: [7]
sweep:
  param: K
  values: [50, 60]
algorithms: [sempa_look, random_pa]
