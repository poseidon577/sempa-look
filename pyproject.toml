[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sempalab"
version = "0.1.0"
description = "Implementation and research reproduction of SemPA-Look"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "tqdm",
    "torch",
    "sentence-transformers",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]